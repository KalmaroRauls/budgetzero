on:
  # Manual only: requires a NETLIFY_SITE_ID secret that is not configured here,
  # so this was failing on every push. Run it from the Actions tab when needed.
  workflow_dispatch:
name: Publish on Netlify

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@master

    - name: Publish
      uses: netlify/actions/build@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}