name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  #Allows deploying on demand from the Actions tab
  workflow_dispatch:

#Permissions required by the GitHub Pages deployment actions
permissions:
  contents: read
  pages: write
  id-token: write

#One deployment at a time, and never cancel a deployment that already started
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      #--legacy-peer-deps lets npm install resolve the peer ranges in this tree
      #--ignore-scripts skips the install scripts (node-sass 6 has no binary for Node 18
      #and the web build uses dart-sass), so electron's binary is fetched explicitly below:
      #vue-cli-service build requires it and fails with "Electron failed to install correctly"
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --ignore-scripts
          node node_modules/electron/install.js

      - name: Build
        run: npm run build

      #The app uses vue-router history mode, so GitHub Pages needs a fallback page
      #to serve deep links like /budgetzero/piechart directly
      - name: Add SPA fallback page
        run: cp dist/index.html dist/404.html

      #Stops Jekyll from skipping files and folders that start with an underscore
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
