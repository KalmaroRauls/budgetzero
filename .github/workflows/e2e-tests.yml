name: Cypress Tests

on:
  # Manual only: the dev server/Electron setup does not run on CI runners and
  # this check was failing on every push. Run it from the Actions tab when needed.
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      # Install NPM dependencies, cache them correctly
      # and run all Cypress tests
      - name: Cypress run
        uses: cypress-io/github-action@v4
        with:
          start: npm run serve
          wait-on: 'http://localhost:8080'
          config: baseUrl=http://localhost:8080