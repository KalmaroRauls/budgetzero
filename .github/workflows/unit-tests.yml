name: unit tests
on:
  # Manual only: this check cannot install on modern CI runners (node-sass@6) and
  # was failing on every push. Run it from the Actions tab when needed.
  workflow_dispatch:

jobs:
  unit_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install modules
      run: npm ci
    - name: Run tests
      run: npm run test:unit